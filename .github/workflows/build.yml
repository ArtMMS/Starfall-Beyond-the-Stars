name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Generates models, blockstates, loot tables, recipes and tags
      # into src/generated/resources before building the jar
      - name: Run data generation
        run: ./gradlew runData

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: starfall-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload generated resources
        uses: actions/upload-artifact@v4
        with:
          name: generated-resources
          path: src/generated/resources/
          if-no-files-found: warn
