# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment: better parameter names and javadoc for Minecraft code
# https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# ===== Environment =====
# https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.252
# Minimum NeoForge version players need (anything from here up works)
neo_version_range=[21.1.252,)
loader_version_range=[1,)

# ===== Mod Properties =====
# Must match Starfall.MODID in the main mod class. Regex: [a-z][a-z0-9_]{1,63}
mod_id=starfall
mod_name=Starfall: Beyond the Stars
# Review your options at https://choosealicense.com/
mod_license=LGPL-3.0-only
# https://semver.org/
mod_version=0.0.1
# Must match the base package of the mod sources
mod_group_id=com.artmms.starfall
mod_authors=ArtMMS
mod_description=Extract fuel, launch rockets, survive hostile worlds and witness rare cosmic events among the stars and back home in the Overworld.
mod_url=https://github.com/ArtMMS/Starfall-Beyond-the-Stars
mod_issues_url=https://github.com/ArtMMS/Starfall-Beyond-the-Stars/issues
