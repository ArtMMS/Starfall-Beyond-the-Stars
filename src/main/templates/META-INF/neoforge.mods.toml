# Starfall: Beyond the Stars - mod metadata
# Values like ${mod_id} are filled from gradle.properties at build time.

modLoader="javafml" #mandatory

loaderVersion="${loader_version_range}" #mandatory

license="${mod_license}"

issueTrackerURL="${mod_issues_url}" #optional

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

displayURL="${mod_url}" #optional

#logoFile="starfall.png" #optional

authors="${mod_authors}" #optional

description='''
${mod_description}
'''

# Mixins (uncomment when needed)
#[[mixins]]
#config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"